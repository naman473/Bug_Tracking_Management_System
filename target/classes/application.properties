spring.application.name=bugtracker

# ── DataSource ────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/bugtrackerdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── Connection pool (HikariCP) ────────────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ── Thymeleaf ─────────────────────────────────────────────────────────────────
spring.thymeleaf.cache=false

# ── MVC ───────────────────────────────────────────────────────────────────────
spring.mvc.hiddenmethod.filter.enabled=true
# Route unmatched requests through DispatcherServlet so GlobalExceptionHandler
# renders error.html instead of the container's default error page.
spring.mvc.throw-exception-if-no-handler-found=true

# ── Server ────────────────────────────────────────────────────────────────────
server.port=8080
server.error.whitelabel.enabled=false

# ── File upload ───────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.startechies.bugtracker=INFO
logging.level.org.springframework.security=WARN
