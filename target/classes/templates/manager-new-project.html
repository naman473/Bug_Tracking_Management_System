<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('New Project')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<div class="container py-5" style="max-width:680px">
  <div class="page-header d-flex justify-content-between align-items-center">
    <div>
      <h2><i class="bi bi-plus-circle me-2"></i>Create New Project</h2>
      <p class="sub">Fill in the details and assign your initial team.</p>
    </div>
    <a class="btn btn-outline-secondary btn-sm" href="/manager/projects">
      <i class="bi bi-arrow-left me-1"></i>Back
    </a>
  </div>

  <div class="card card-soft p-4">
    <form method="post" action="/manager/projects" id="newProjectForm">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

      <div class="row g-3">
        <div class="col-md-8">
          <label class="form-label" for="pname">Project name</label>
          <input class="form-control" type="text" id="pname" name="pname"
                 required maxlength="100" placeholder="e.g. Auth Service v2">
        </div>
        <div class="col-md-4">
          <label class="form-label" for="sdate">Start date</label>
          <input class="form-control" type="date" id="sdate" name="sdate" required>
        </div>
        <div class="col-12">
          <label class="form-label" for="desc">Description</label>
          <textarea class="form-control" id="desc" name="desc"
                    rows="3" maxlength="300"
                    placeholder="Brief description of the project…"></textarea>
        </div>

        <!-- Single multi-select with optgroups — both groups use name="teamMembers"
             so Spring collects them all into one String[] parameter cleanly -->
        <div class="col-12">
          <label class="form-label" for="teamMembers">
            Team members
            <span class="text-indent fw-normal">(hold Ctrl / Cmd to select multiple)</span>
          </label>
          <select class="form-select" id="teamMembers" name="teamMembers" multiple size="10">
            <optgroup label="Developers" th:if="${!#lists.isEmpty(developers)}">
              <option th:each="dev : ${developers}"
                      th:value="${dev.userName}"
                      th:text="${dev.userName}"></option>
            </optgroup>
            <optgroup label="Testers" th:if="${!#lists.isEmpty(testers)}">
              <option th:each="tester : ${testers}"
                      th:value="${tester}"
                      th:text="${tester}"></option>
            </optgroup>
          </select>
          <div class="form-text">You (the manager) are automatically added to the project.</div>
          <div class="mt-1 small text-indent" id="selectionCount">0 members selected</div>
        </div>
      </div>

      <div class="mt-4 d-flex gap-2">
        <button class="btn btn-primary px-4" type="submit">
          <i class="bi bi-check-lg me-1"></i>Create Project
        </button>
        <a class="btn btn-outline-secondary" href="/manager/projects">Cancel</a>
      </div>
    </form>
  </div>
</div>

<div th:replace="~{layout :: scripts}"></div>
<script>
  // Set today as default start date
  document.getElementById('sdate').valueAsDate = new Date();

  // Live selection counter
  const sel = document.getElementById('teamMembers');
  const cnt = document.getElementById('selectionCount');
  sel.addEventListener('change', () => {
    const n = sel.selectedOptions.length;
    cnt.textContent = n === 0 ? '0 members selected'
                    : n === 1 ? '1 member selected'
                    : n + ' members selected';
  });
</script>
</body>
</html>
