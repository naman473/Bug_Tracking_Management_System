<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Report Bug')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<div class="container py-5" style="max-width:700px">
  <div class="page-header d-flex justify-content-between align-items-center">
    <div>
      <h2><i class="bi bi-bug-fill me-2 text-danger"></i>Report New Bug</h2>
      <p class="sub">Describe the issue clearly so it can be reproduced and fixed.</p>
    </div>
    <a class="btn btn-outline-secondary btn-sm" href="/tester/bugs">
      <i class="bi bi-arrow-left me-1"></i>Back
    </a>
  </div>

  <!-- No project warning -->
  <div th:if="${#lists.isEmpty(projects)}" class="alert alert-warning d-flex gap-2">
    <i class="bi bi-exclamation-triangle-fill"></i>
    <span>You are not assigned to any projects. Contact your Project Manager to be added.</span>
  </div>

  <div class="card card-soft p-4" th:if="${!#lists.isEmpty(projects)}">
    <form method="post" action="/tester/report-bug" id="bugForm">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Project</label>
          <select class="form-select" name="pname" required>
            <option value="">Select project…</option>
            <option th:each="project : ${projects}"
                    th:value="${project.projectName}"
                    th:text="${project.projectName}"></option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Severity</label>
          <select class="form-select" name="severity" required>
            <option value="">Choose severity…</option>
            <option value="critical">🔴 Critical — system unusable</option>
            <option value="major">🟠 Major — major feature broken</option>
            <option value="minor">🟡 Minor — minor issue</option>
            <option value="trivial">⚪ Trivial — cosmetic / low impact</option>
          </select>
        </div>
        <div class="col-12">
          <label class="form-label">Bug title</label>
          <input class="form-control" type="text" name="bugtitle" required maxlength="100"
                 placeholder="Short, descriptive summary" id="bugTitle">
          <div class="d-flex justify-content-end">
            <span class="form-text"><span id="titleCount">0</span>/100</span>
          </div>
        </div>
        <div class="col-12">
          <label class="form-label">Description</label>
          <textarea class="form-control" name="descbug" rows="5" required maxlength="500"
                    id="bugDesc"
                    placeholder="Steps to reproduce, expected vs actual behaviour…"></textarea>
          <div class="d-flex justify-content-end">
            <span class="form-text"><span id="descCount">0</span>/500</span>
          </div>
        </div>
      </div>
      <div class="mt-4 d-flex gap-2">
        <button class="btn btn-primary px-4" type="submit">
          <i class="bi bi-send me-1"></i>Submit Bug
        </button>
        <a class="btn btn-outline-secondary" href="/tester/bugs">Cancel</a>
      </div>
    </form>
  </div>
</div>

<div th:replace="~{layout :: scripts}"></div>
<script>
  function charCounter(inputId, countId) {
    const el = document.getElementById(inputId);
    const ct = document.getElementById(countId);
    if (el && ct) {
      el.addEventListener('input', () => ct.textContent = el.value.length);
    }
  }
  charCounter('bugTitle', 'titleCount');
  charCounter('bugDesc',  'descCount');
</script>
</body>
</html>
