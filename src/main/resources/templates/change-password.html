<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Change Password')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<div class="container py-5" style="max-width:480px">
  <div class="page-header">
    <h2><i class="bi bi-key-fill me-2"></i>Change Password</h2>
    <p class="sub">Choose a strong password you haven't used before.</p>
  </div>

  <div class="card card-soft p-4">

    <div class="alert alert-success d-flex gap-2" th:if="${success}">
      <i class="bi bi-check-circle-fill"></i><span th:text="${success}"></span>
    </div>
    <div class="alert alert-danger  d-flex gap-2" th:if="${error}">
      <i class="bi bi-exclamation-circle-fill"></i><span th:text="${error}"></span>
    </div>

    <form method="post" action="/account/change-password" id="cpForm">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

      <div class="mb-3">
        <label class="form-label" for="currentPassword">Current password</label>
        <div class="input-group">
          <input class="form-control" type="password" id="currentPassword"
                 name="currentPassword" required autocomplete="current-password">
          <button class="btn btn-outline-secondary" type="button" id="toggleCurrent" tabindex="-1">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <div class="mb-2">
        <label class="form-label" for="newPassword">New password</label>
        <div class="input-group">
          <input class="form-control" type="password" id="newPassword"
                 name="newPassword" required autocomplete="new-password">
          <button class="btn btn-outline-secondary" type="button" id="toggleNew" tabindex="-1">
            <i class="bi bi-eye" id="newEye"></i>
          </button>
        </div>
        <div style="height:4px;border-radius:2px;background:#e2e8f0;overflow:hidden;margin-top:4px">
          <div id="strengthBar" style="height:100%;width:0;transition:width .3s,background .3s;border-radius:2px"></div>
        </div>
        <div class="form-text" id="strengthHint">Min 8 chars · letter · digit · special character</div>
      </div>

      <div class="mb-4">
        <label class="form-label" for="confirmPassword">Confirm new password</label>
        <input class="form-control" type="password" id="confirmPassword"
               name="confirmPassword" required autocomplete="new-password">
        <div class="invalid-feedback">Passwords do not match.</div>
      </div>

      <button class="btn btn-primary w-100" type="submit">
        <i class="bi bi-shield-check me-1"></i>Update Password
      </button>
    </form>
  </div>
</div>

<div th:replace="~{layout :: scripts}"></div>
<script>
  function makeToggle(btnId, inputId, iconId) {
    const btn = document.getElementById(btnId);
    const inp = document.getElementById(inputId);
    const ico = iconId ? document.getElementById(iconId) : btn.querySelector('i');
    if (btn) btn.addEventListener('click', () => {
      const show = inp.type === 'password';
      inp.type = show ? 'text' : 'password';
      ico.className = show ? 'bi bi-eye-slash' : 'bi bi-eye';
    });
  }
  makeToggle('toggleCurrent', 'currentPassword');
  makeToggle('toggleNew',     'newPassword',     'newEye');

  const newPsw     = document.getElementById('newPassword');
  const confirmPsw = document.getElementById('confirmPassword');
  const sBar       = document.getElementById('strengthBar');
  const sHint      = document.getElementById('strengthHint');

  newPsw.addEventListener('input', () => {
    const v = newPsw.value;
    let score = 0;
    if (v.length >= 8) score++;
    if (/[A-Za-z]/.test(v)) score++;
    if (/[0-9]/.test(v)) score++;
    if (/[^A-Za-z0-9]/.test(v)) score++;
    const cols = ['#ef4444','#f59e0b','#eab308','#10b981'];
    const lbls = ['Too weak','Fair','Good','Strong'];
    sBar.style.width      = ((score/4)*100) + '%';
    sBar.style.background = cols[score-1] || '#e2e8f0';
    sHint.textContent     = score > 0 ? lbls[score-1] : 'Min 8 chars · letter · digit · special character';
  });

  document.getElementById('cpForm').addEventListener('submit', e => {
    if (newPsw.value !== confirmPsw.value) {
      confirmPsw.classList.add('is-invalid');
      e.preventDefault();
    }
  });
  confirmPsw.addEventListener('input', () => {
    if (newPsw.value === confirmPsw.value) confirmPsw.classList.remove('is-invalid');
  });
</script>
</body>
</html>
