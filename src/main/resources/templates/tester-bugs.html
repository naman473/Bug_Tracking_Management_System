<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('My Bugs')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<div class="container py-5">
  <div class="page-header d-flex justify-content-between align-items-center flex-wrap gap-2">
    <div>
      <h2><i class="bi bi-list-ul me-2"></i>My Reported Bugs</h2>
      <p class="sub" th:text="${#lists.size(testerBugList)} + ' bug(s)'"></p>
    </div>
    <a class="btn btn-primary" href="/tester/report-bug">
      <i class="bi bi-plus-lg me-1"></i>Report Bug
    </a>
  </div>

  <div class="alert alert-success d-flex gap-2" th:if="${message}">
    <i class="bi bi-check-circle-fill"></i><span th:text="${message}"></span>
  </div>
  <div class="alert alert-info    d-flex gap-2" th:if="${commentSuccess}">
    <i class="bi bi-chat-dots-fill"></i><span th:text="${commentSuccess}"></span>
  </div>
  <div class="alert alert-warning d-flex gap-2" th:if="${commentError}">
    <i class="bi bi-exclamation-triangle-fill"></i><span th:text="${commentError}"></span>
  </div>

  <div th:if="${#lists.isEmpty(testerBugList)}" class="card card-soft">
    <div class="empty-state py-5">
      <i class="bi bi-bug text-indent"></i>
      <div class="fw-semibold mb-1">No bugs reported yet</div>
      <a class="btn btn-primary btn-sm mt-2" href="/tester/report-bug">Report your first bug</a>
    </div>
  </div>

  <div th:each="bug : ${testerBugList}" class="card card-soft mb-3 p-3">
    <!-- Bug header row -->
    <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-1">
      <div>
        <span class="fw-bold" th:text="${bug.bugTitle}"></span>
        <span class="text-indent small ms-2" th:text="${bug.bugId}"></span>
        <span class="text-indent small ms-1" th:text="${'· ' + bug.projectName}"></span>
      </div>
      <div class="d-flex gap-1 flex-wrap align-items-center">
        <span th:text="${bug.bugStatus.dbValue}" class="badge rounded-pill"
              th:classappend="${bug.bugStatus.dbValue == 'Open' ? 'badge-open' : bug.bugStatus.dbValue == 'Assigned' ? 'badge-assigned' : 'badge-closed'}"></span>
        <span th:if="${bug.severity != null}" th:text="${bug.severity.dbValue}" class="badge"
              th:classappend="${bug.severity.dbValue == 'critical' ? 'sev-critical' : bug.severity.dbValue == 'major' ? 'sev-major' : bug.severity.dbValue == 'minor' ? 'sev-minor' : 'sev-trivial'}"></span>
        <!-- Edit toggle (only if not closed) -->
        <button th:if="${bug.bugStatus.dbValue != 'Closed'}"
                class="btn btn-sm btn-outline-secondary"
                type="button"
                th:data-bs-toggle="'collapse'"
                th:data-bs-target="${'#edit-' + bug.bugId}"
                title="Edit bug">
          <i class="bi bi-pencil"></i>
        </button>
      </div>
    </div>

    <p class="text-indent small mb-1" th:text="${bug.bugDesc}"></p>
    <div class="text-indent small" th:if="${bug.openDate}">
      <i class="bi bi-calendar3 me-1"></i><span th:text="${bug.openDate}"></span>
    </div>

    <!-- Inline edit form (collapsible) -->
    <div th:if="${bug.bugStatus.dbValue != 'Closed'}"
         class="collapse mt-3 border-top pt-3"
         th:id="${'edit-' + bug.bugId}">
      <p class="small fw-semibold text-indent mb-2"><i class="bi bi-pencil-square me-1"></i>Edit bug</p>
      <form method="post"
            th:action="@{/tester/bugs/{id}/edit(id=${bug.bugId})}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="row g-2">
          <div class="col-md-8">
            <label class="form-label">Title</label>
            <input class="form-control form-control-sm" type="text" name="bugtitle"
                   th:value="${bug.bugTitle}" required maxlength="100">
          </div>
          <div class="col-md-4">
            <label class="form-label">Severity</label>
            <select class="form-select form-select-sm" name="severity" required>
              <option value="critical" th:selected="${bug.severity != null and bug.severity.dbValue == 'critical'}">🔴 Critical</option>
              <option value="major"    th:selected="${bug.severity != null and bug.severity.dbValue == 'major'}">🟠 Major</option>
              <option value="minor"    th:selected="${bug.severity != null and bug.severity.dbValue == 'minor'}">🟡 Minor</option>
              <option value="trivial"  th:selected="${bug.severity == null or bug.severity.dbValue == 'trivial'}">⚪ Trivial</option>
            </select>
          </div>
          <div class="col-12">
            <label class="form-label">Description</label>
            <textarea class="form-control form-control-sm" name="descbug"
                      rows="3" required maxlength="500"
                      th:text="${bug.bugDesc}"></textarea>
          </div>
          <div class="col-12 d-flex gap-2">
            <button class="btn btn-sm btn-primary" type="submit">
              <i class="bi bi-check-lg me-1"></i>Save changes
            </button>
            <button class="btn btn-sm btn-outline-secondary" type="button"
                    th:data-bs-toggle="'collapse'"
                    th:data-bs-target="${'#edit-' + bug.bugId}">
              Cancel
            </button>
          </div>
        </div>
      </form>
    </div>

    <!-- Comments with safe returnTo -->
    <div th:replace="~{layout :: comments(${bug.bugId}, ${comments}, '/tester/bugs')}"></div>
  </div>
</div>

<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
