<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Projects')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<div class="container py-5">
  <div class="page-header d-flex justify-content-between align-items-center flex-wrap gap-2">
    <div>
      <h2><i class="bi bi-kanban me-2"></i>Your Projects</h2>
      <p class="sub" th:text="${#lists.size(projects)} + ' project(s)'"></p>
    </div>
    <a class="btn btn-primary" href="/manager/projects/new">
      <i class="bi bi-plus-lg me-1"></i>New Project
    </a>
  </div>

  <div class="alert alert-danger d-flex gap-2" th:if="${param.denied}">
    <i class="bi bi-shield-exclamation-fill"></i>
    <span>Access denied — you do not own that project.</span>
  </div>

  <div class="alert alert-success d-flex gap-2" th:if="${message}">
    <i class="bi bi-check-circle-fill"></i><span th:text="${message}"></span>
  </div>

  <!-- Empty state -->
  <div th:if="${#lists.isEmpty(projects)}" class="card card-soft">
    <div class="empty-state">
      <i class="bi bi-kanban"></i>
      <div class="fw-semibold mb-1">No projects yet</div>
      <p class="small mb-3">Create your first project to get started.</p>
      <a class="btn btn-primary btn-sm" href="/manager/projects/new">Create project</a>
    </div>
  </div>

  <div th:if="${!#lists.isEmpty(projects)}" class="row g-3">
    <div class="col-md-6 col-lg-4" th:each="project : ${projects}">
      <div class="card card-soft h-100 p-3">
        <div class="d-flex justify-content-between align-items-start mb-2">
          <h6 class="fw-bold mb-0" th:text="${project.projectName}"></h6>
          <span class="badge rounded-pill"
                th:classappend="${project.projectStateValue == 'InProgress' ? 'bg-primary' : 'bg-secondary'}"
                th:text="${project.projectStateValue}"></span>
        </div>
        <p class="text-indent small mb-2" th:text="${project.projectDesc}"></p>
        <div class="text-indent small mb-3">
          <i class="bi bi-calendar3 me-1"></i>
          <span th:text="${project.startDate}"></span>
        </div>
        <a class="btn btn-outline-primary btn-sm mt-auto"
           th:href="@{/manager/projects/{n}(n=${project.projectName})}">
          <i class="bi bi-folder2-open me-1"></i>Open
        </a>
      </div>
    </div>
  </div>
</div>

<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
