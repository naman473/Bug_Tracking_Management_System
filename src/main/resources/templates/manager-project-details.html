<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head('Project Details')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<div class="container py-4">

  <!-- Header -->
  <div class="page-header d-flex justify-content-between align-items-start flex-wrap gap-2">
    <div>
      <h2 th:text="${projectName}">Project</h2>
      <p class="sub">
        <i class="bi bi-person me-1"></i><span th:text="${managerName}"></span> ·
        <i class="bi bi-calendar3 me-1 ms-1"></i><span th:text="${startDate}"></span>
      </p>
    </div>
    <a class="btn btn-outline-secondary btn-sm" href="/manager/projects">
      <i class="bi bi-arrow-left me-1"></i>All Projects
    </a>
  </div>

  <!-- Flash messages -->
  <div class="alert alert-success   d-flex gap-2" th:if="${message}"       ><i class="bi bi-check-circle-fill"></i><span th:text="${message}"></span></div>
  <div class="alert alert-info      d-flex gap-2" th:if="${commentSuccess}" ><i class="bi bi-chat-dots-fill"></i><span th:text="${commentSuccess}"></span></div>
  <div class="alert alert-warning   d-flex gap-2" th:if="${commentError}"   ><i class="bi bi-exclamation-triangle-fill"></i><span th:text="${commentError}"></span></div>

  <!-- Stat bar -->
  <div class="row g-3 mb-4">
    <div class="col-6 col-md-3">
      <div class="stat-card" style="background:linear-gradient(135deg,#6366f1,#818cf8)">
        <div class="stat-val" th:text="${stats.total}">0</div>
        <div class="stat-lbl">Total bugs</div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="stat-card" style="background:linear-gradient(135deg,#0ea5e9,#38bdf8)">
        <div class="stat-val" th:text="${stats.open}">0</div>
        <div class="stat-lbl"><i class="bi bi-circle me-1"></i>Open</div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="stat-card stat-assigned">
        <div class="stat-val" th:text="${stats.assigned}">0</div>
        <div class="stat-lbl"><i class="bi bi-person-check me-1"></i>Assigned</div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="stat-card stat-closed">
        <div class="stat-val" th:text="${stats.closed}">0</div>
        <div class="stat-lbl"><i class="bi bi-check-circle me-1"></i>Closed</div>
      </div>
    </div>
  </div>

  <div class="row g-4">

    <!-- ── Left column: team + assign ── -->
    <div class="col-lg-4">

      <!-- Team -->
      <div class="card card-soft mb-3">
        <div class="card-header px-3 py-2">
          <i class="bi bi-people-fill me-1"></i>Team
          <span class="badge bg-secondary rounded-pill ms-1" th:text="${#lists.size(team)}"></span>
        </div>
        <ul class="list-group list-group-flush">
          <li class="list-group-item d-flex justify-content-between align-items-center py-2"
              th:each="member : ${team}">
            <span class="small fw-semibold" th:text="${member.userName}"></span>
            <span class="badge rounded-pill small"
                  th:classappend="${member.roleValue == 'ProjectManager' ? 'bg-primary' : member.roleValue == 'Tester' ? 'bg-info text-dark' : 'bg-success'}"
                  th:text="${member.roleValue}"></span>
          </li>
          <li class="list-group-item text-indent small fst-italic" th:if="${#lists.isEmpty(team)}">No team members.</li>
        </ul>
      </div>

      <!-- Assign bug -->
      <div class="card card-soft">
        <div class="card-header px-3 py-2">
          <i class="bi bi-person-check-fill me-1"></i>Assign Bug
        </div>
        <div class="p-3">
          <form method="post" th:action="@{/manager/projects/{n}/assign(n=${projectName})}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="mb-2">
              <label class="form-label">Bug</label>
              <select class="form-select form-select-sm" name="bugId" required>
                <option value="">Select bug…</option>
                <option th:each="bug : ${bugs}"
                        th:if="${bug.bugStatus.dbValue != 'Closed'}"
                        th:value="${bug.bugId}"
                        th:text="${bug.bugTitle + ' (' + bug.bugId + ')'}"></option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Developer</label>
              <select class="form-select form-select-sm" name="devName" required>
                <option value="">Select developer…</option>
                <option th:each="dev : ${developers}"
                        th:value="${dev.userName}"
                        th:text="${dev.userName}"></option>
              </select>
            </div>
            <button class="btn btn-primary btn-sm w-100" type="submit">
              <i class="bi bi-person-check me-1"></i>Assign
            </button>
          </form>
        </div>
      </div>
    </div>

    <!-- ── Right column: filters + bugs ── -->
    <div class="col-lg-8">

      <!-- Filters -->
      <div class="card card-soft p-3 mb-3">
        <form method="get" th:action="@{/manager/projects/{n}(n=${projectName})}"
              class="row g-2 align-items-end">
          <div class="col-sm-4">
            <label class="form-label">Status</label>
            <select class="form-select form-select-sm" name="status">
              <option value="all"      th:selected="${status == 'all'}">All statuses</option>
              <option value="Open"     th:selected="${status == 'Open'}">Open</option>
              <option value="Assigned" th:selected="${status == 'Assigned'}">Assigned</option>
              <option value="Closed"   th:selected="${status == 'Closed'}">Closed</option>
            </select>
          </div>
          <div class="col-sm-4">
            <label class="form-label">Severity</label>
            <select class="form-select form-select-sm" name="severity">
              <option value="all"      th:selected="${severity == 'all'}">All severities</option>
              <option value="critical" th:selected="${severity == 'critical'}">Critical</option>
              <option value="major"    th:selected="${severity == 'major'}">Major</option>
              <option value="minor"    th:selected="${severity == 'minor'}">Minor</option>
              <option value="trivial"  th:selected="${severity == 'trivial'}">Trivial</option>
            </select>
          </div>
          <div class="col-sm-auto">
            <button class="btn btn-outline-primary btn-sm" type="submit">
              <i class="bi bi-funnel me-1"></i>Filter
            </button>
            <a class="btn btn-outline-secondary btn-sm ms-1"
               th:href="@{/manager/projects/{n}(n=${projectName})}">Reset</a>
          </div>
        </form>
      </div>

      <!-- Bug list -->
      <div class="card card-soft">
        <div class="card-header px-3 py-2 d-flex justify-content-between">
          <span><i class="bi bi-bug me-1"></i>Bugs</span>
          <span class="badge bg-secondary rounded-pill" th:text="${#lists.size(bugs)}"></span>
        </div>

        <div th:if="${#lists.isEmpty(bugs)}" class="empty-state py-4">
          <i class="bi bi-check2-circle text-success"></i>
          <div>No bugs match the current filters.</div>
        </div>

        <div th:each="bug : ${bugs}" class="border-bottom p-3">
          <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
            <div>
              <span class="fw-semibold" th:text="${bug.bugTitle}"></span>
              <span class="text-indent small ms-2" th:text="${bug.bugId}"></span>
              <div class="text-indent small mt-1" th:if="${bug.assignedTo != null}">
                <i class="bi bi-person me-1"></i><span th:text="${bug.assignedTo}"></span>
              </div>
            </div>
            <div class="d-flex gap-1 flex-wrap align-items-center">
              <!-- Status badge -->
              <span th:text="${bug.bugStatus.dbValue}" class="badge rounded-pill"
                    th:classappend="${bug.bugStatus.dbValue == 'Open'     ? 'badge-open'     :
                                      bug.bugStatus.dbValue == 'Assigned' ? 'badge-assigned' :
                                      bug.bugStatus.dbValue == 'Closed'   ? 'badge-closed'   : 'bg-secondary'}"></span>
              <!-- Severity badge -->
              <span th:if="${bug.severity != null}" th:text="${bug.severity.dbValue}" class="badge"
                    th:classappend="${bug.severity.dbValue == 'critical' ? 'sev-critical' :
                                      bug.severity.dbValue == 'major'    ? 'sev-major'    :
                                      bug.severity.dbValue == 'minor'    ? 'sev-minor'    : 'sev-trivial'}"></span>
              <!-- Mark / Close actions -->
              <form th:if="${bug.bugStatus.dbValue != 'Closed'}"
                    th:action="@{/manager/projects/{pname}/bugs/{id}/mark-for-close(pname=${projectName},id=${bug.bugId})}"
                    method="post" class="d-inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="btn btn-sm btn-warning" type="submit"
                        th:disabled="${bug.markedForClosing}"
                        th:title="${bug.markedForClosing ? 'Already marked' : 'Mark for close'}">
                  <i class="bi bi-flag"></i>
                </button>
              </form>
              <form th:if="${bug.bugStatus.dbValue != 'Closed'}"
                    th:action="@{/manager/projects/{pname}/bugs/{id}/close(pname=${projectName},id=${bug.bugId})}"
                    method="post" class="d-inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="btn btn-sm btn-success" type="submit"
                        th:disabled="${!bug.markedForClosing}"
                        th:title="${!bug.markedForClosing ? 'Flag the bug first' : 'Close bug'}">
                  <i class="bi bi-check-lg"></i>
                </button>
              </form>
            </div>
          </div>

          <!-- Description -->
          <p class="text-indent small mt-1 mb-0" th:if="${bug.bugDesc}" th:text="${bug.bugDesc}"></p>

          <!-- Open date -->
          <div class="text-indent small mt-1" th:if="${bug.openDate}">
            <i class="bi bi-calendar3 me-1"></i><span th:text="${bug.openDate}"></span>
          </div>

          <!-- Comments -->
          <div th:replace="~{layout :: comments(${bug.bugId}, ${comments},
              '/manager/projects/' + ${projectName})}"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
